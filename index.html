<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 修改 viewport 允许缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>趣味标点符号大挑战</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        body {
            /* 尝试使用系统自带的楷体，如果没有则降级 */
            font-family: 'Kaiti', 'STKaiti', 'KaiTi_GB2312', 'ZCOOL KuaiLe', cursive, sans-serif;
            background-color: #f0fdf4; /* 浅绿色背景 */
            background-image: radial-gradient(#dcfce7 2px, transparent 2px);
            background-size: 30px 30px;
            touch-action: manipulation; /* 优化触摸体验 */
        }

        .game-container {
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .question-box {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border: 4px dashed #6ee7b7;
            font-size: 1.5rem;
            line-height: 2.5;
            color: #1e3a8a;
            position: relative;
        }

        /* 拖拽目标区域（空槽） */
        .drop-zone {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 2px dashed #9ca3af;
            border-radius: 8px;
            vertical-align: middle;
            margin: 0 5px;
            background-color: #f3f4f6;
            text-align: center;
            line-height: 36px;
            transition: all 0.2s;
        }

        .drop-zone.drag-over {
            background-color: #fef08a;
            border-color: #eab308;
            transform: scale(1.1);
        }
        
        .drop-zone.filled {
             border: 2px solid #3b82f6;
             background-color: #eff6ff;
             color: #1d4ed8;
             font-weight: bold;
        }

        .punctuation-pool {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .punctuation-item {
            width: 50px;
            height: 50px;
            background-color: #fef08a; /* 亮黄色 */
            border: 3px solid #eab308;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #b45309;
            cursor: grab;
            user-select: none;
            box-shadow: 0 4px 0 #ca8a04;
            transition: transform 0.1s;
            touch-action: none; /* 阻止默认触摸事件，用于自定义拖拽 */
        }

        .punctuation-item:active {
            cursor: grabbing;
            transform: translateY(4px);
            box-shadow: 0 0 0 #ca8a04;
        }

        .btn-submit {
            background: linear-gradient(to bottom, #4ade80, #22c55e);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #16a34a, 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.1s;
            margin: 0 auto;
            display: block;
        }

        .btn-submit:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #16a34a, 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-submit:disabled {
            background: #d1d5db;
            box-shadow: 0 6px 0 #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        /* 结果动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .wrong-anim { animation: shake 0.5s; border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .correct-anim { animation: pop 0.5s; border-color: #22c55e !important; background-color: #f0fdf4 !important; }

        /* 隐藏的拖动副本（用于触摸设备） */
        .drag-ghost {
            position: absolute;
            pointer-events: none;
            opacity: 0.8;
            z-index: 1000;
        }

        #celebration {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0fdf4;
            background-image: radial-gradient(#dcfce7 2px, transparent 2px);
            background-size: 30px 30px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 隐藏游戏主界面直到开始 */
        #main-game-ui {
            display: none;
            /* 确保内容超出时可以滚动 */
            overflow: auto;
        }

        /* 导航按钮样式 */
        .nav-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #2563eb;
            transition: all 0.1s;
        }

        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2563eb;
        }

        .nav-btn:disabled {
            background-color: #9ca3af;
            box-shadow: 0 4px 0 #6b7280;
            cursor: not-allowed;
            transform: none;
        }

        .nav-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 50; /* 确保在最上层 */
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 class="text-5xl md:text-7xl font-bold text-green-600 drop-shadow-lg mb-8 title-anim text-center">✨ 趣味标点符号 ✨<br><span class="text-4xl md:text-6xl text-blue-500">大挑战</span></h1>
        <p class="text-2xl text-gray-700 mb-8 max-w-lg px-4 text-center">拖动彩色标点符号，填入句子的空白处，看看你能答对多少题！</p>
        <button class="btn-submit" onclick="startGame()">开始游戏 🚀</button>
    </div>

    <div class="game-container" id="main-game-ui">
        <!-- 头部信息 -->
        <div class="relative flex flex-col md:flex-row justify-center items-center mb-6 gap-4">
            <h1 class="text-2xl md:text-3xl font-bold text-green-600 drop-shadow-md text-center z-10 w-full">✨ 趣味标点符号大挑战 ✨</h1>
            <div class="md:absolute md:right-0 text-lg md:text-xl bg-white px-4 py-2 rounded-full shadow border-2 border-green-200 z-20">
                进度: <span id="progress" class="text-green-600 font-bold">1 / 20</span>
            </div>
        </div>

        <!-- 题目区域 -->
        <div class="question-box" id="question-container">
            <!-- 题目内容将通过 JS 动态生成 -->
        </div>

        <!-- 标点符号池 -->
        <div id="instruction-text" class="text-center mb-2 text-gray-600 font-bold">把下方的标点符号拖到上面的方框里吧！</div>
        <div class="punctuation-pool" id="pool">
            <div class="punctuation-item" draggable="true" data-punct="，">，</div>
            <div class="punctuation-item" draggable="true" data-punct="。">。</div>
            <div class="punctuation-item" draggable="true" data-punct="、">、</div>
            <div class="punctuation-item" draggable="true" data-punct="？">？</div>
            <div class="punctuation-item" draggable="true" data-punct="！">！</div>
            <div class="punctuation-item" draggable="true" data-punct="：">：</div>
            <div class="punctuation-item" draggable="true" data-punct="“">“</div>
            <div class="punctuation-item" draggable="true" data-punct="”">”</div>
        </div>

        <!-- 提交按钮 -->
        <button class="btn-submit" id="submit-btn" disabled>提交答案</button>

        <!-- 提示信息 -->
        <div id="message" class="text-center mt-4 text-xl font-bold h-8"></div>
        
        <!-- 底部导航按钮 -->
        <div class="nav-container" id="nav-buttons" style="display: none;">
            <button class="nav-btn" id="prev-btn" onclick="goToPrevQuestion()">⬅️ 上一题</button>
            <button class="nav-btn" id="next-btn" onclick="goToNextQuestion()">下一题 ➡️</button>
            <button class="nav-btn" id="exit-review-btn" onclick="exitReview()" style="display: none; background-color: #f59e0b; box-shadow: 0 4px 0 #d97706;">🏠 结束回看</button>
        </div>
    </div>

    <!-- 通关动画界面 -->
    <div id="celebration">
        <h2 class="text-5xl font-bold text-yellow-300 mb-6 drop-shadow-lg">🎉 恭喜完成！ 🎉</h2>
        <p class="text-2xl mb-8">你是一个标点符号小专家！</p>
        <div class="flex flex-col md:flex-row gap-4">
            <button class="btn-submit" onclick="location.reload()">再玩一次</button>
            <button class="btn-submit" style="background: linear-gradient(to bottom, #3b82f6, #2563eb); box-shadow: 0 6px 0 #1d4ed8;" onclick="startReview()">回看题目与答案</button>
        </div>
    </div>

    <script>
        // 使用 Web Audio API 生成简单的特效音，无需外部资源
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let activeAudioNodes = [];
        let soundTimeouts = [];
        let endTimeout = null; // 用于最后一题结束的延时

        function clearSoundTimeouts() {
            soundTimeouts.forEach(id => clearTimeout(id));
            soundTimeouts = [];
        }

        function stopAllSounds() {
            clearSoundTimeouts();
            activeAudioNodes.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            activeAudioNodes = [];
        }

        function playTone(frequency, type, duration) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);

            activeAudioNodes.push(oscillator);
            oscillator.onended = () => {
                const index = activeAudioNodes.indexOf(oscillator);
                if (index > -1) activeAudioNodes.splice(index, 1);
            };
        }

        const soundEffects = {
            correct: () => {
                stopAllSounds(); // 确保播放新音效前停止旧音效
                // 持续大概3秒的欢快过关特效音 (轻快上扬的琶音)
                const notes = [
                    523.25, 659.25, 783.99, 1046.50, // C5, E5, G5, C6
                    1318.51, 1567.98, 1046.50,       // 升降跳跃
                    1318.51, 1567.98, 2093.00        // 冲向高潮 C7
                ];
                
                // 10个音符，加快节奏，每个间隔100毫秒 = 1秒
                notes.forEach((freq, index) => {
                    const tid = setTimeout(() => playTone(freq, 'sine', 0.25), index * 100);
                    soundTimeouts.push(tid);
                });
                
                // 最后的和弦余音，持续 1.5 秒 (1 + 1.5 = 2.5秒，约在3秒内结束)
                const tid2 = setTimeout(() => {
                    playTone(523.25, 'triangle', 1.5); // C5
                    playTone(659.25, 'triangle', 1.5); // E5
                    playTone(783.99, 'triangle', 1.5); // G5
                    playTone(1046.50, 'triangle', 1.5); // C6
                }, notes.length * 100);
                soundTimeouts.push(tid2);
            },
            wrong: () => {
                stopAllSounds();
                // 嗡嗡声 (答错)
                playTone(200, 'sawtooth', 0.3);
                setTimeout(() => playTone(150, 'sawtooth', 0.4), 150);
            },
            drop: () => {
                // 啵声 (放下)
                playTone(400, 'sine', 0.1);
            }
        };

        const questions = [
            // 题型：文本 + 槽位ID
            { text: "妹妹喜欢吃苹果{0}香蕉和木瓜{1}", answers: ["、", "。"] },
            { text: "我在动物园里看到了老虎{0}猴子和大象{1}", answers: ["、", "。"] },
            { text: "妈妈问弟弟{0}{1}你要吃面包{2}饼干还是蛋糕{3}{4}", answers: ["：", "“", "、", "？", "”"] },
            { text: "姐姐说{0}{1}这件裙子好漂亮啊{2}{3}", answers: ["：", "“", "！", "”"] },
            { text: "老师问小丽{0}{1}你喜欢什么颜色{2}{3}", answers: ["：", "“", "？", "”"] },
            { text: "爸爸对妈妈说{0}{1}我去上班了{2}{3}", answers: ["：", "“", "。", "”"] },
            { text: "花园里开满了五颜六色的花儿{0}有红色{1}黄色{2}橙色和紫色{3}", answers: ["：", "、", "、", "。"] },
            { text: "天亮了{0}辛勤的农夫们都到田里去工作{1}", answers: ["，", "。"] },
            { text: "小猫们玩着一团团毛线{0}真可爱啊{1}", answers: ["，", "！"] },
            { text: "爷爷的果园里种了芒果树{0}香蕉树{1}榴莲树和木瓜树{2}", answers: ["、", "、", "。"] },
            // 补充并加长题型，包含冒号、双引号、顿号等
            { text: "广播员温柔地提醒游客{0}{1}请大家保管好手机{2}钱包{3}钥匙等物品{4}{5}", answers: ["：", "“", "、", "、", "。", "”"] },
            { text: "美术老师笑眯眯地对同学们说{0}{1}今天我们要用到的材料有剪刀{2}胶水{3}彩纸和画笔{4}{5}", answers: ["：", "“", "、", "、", "。", "”"] },
            { text: "妈妈从超市买回了许多蔬菜{0}对我说{1}{2}我买了白菜{3}萝卜{4}番茄和土豆{5}今晚我们吃火锅吧{6}{7}", answers: ["，", "：", "“", "、", "、", "，", "！", "”"] },
            { text: "体育课上{0}老师大声宣布{1}{2}本学期的运动项目包括跳绳{3}跑步{4}游泳和打羽毛球{5}{6}", answers: ["，", "：", "“", "、", "、", "。", "”"] },
            { text: "奶奶坐在摇椅上{0}慢慢地回忆道{1}{2}我小时候最喜欢玩的游戏是跳房子{3}抓石子和捉迷藏{4}{5}", answers: ["，", "：", "“", "、", "。", "”"] },
            { text: "哥哥骄傲地对我说{0}{1}我会演奏很多乐器，比如钢琴{2}吉他和架子鼓{3}{4}", answers: ["：", "“", "、", "。", "”"] },
            { text: "店员阿姨热情地介绍{0}{1}我们这里有草莓味{2}巧克力味和香草味的冰淇淋{3}{4}", answers: ["：", "“", "、", "。", "”"] },
            { text: "大家都亲切地叫弟弟{0}小猴子{1}{2}因为他活泼好动{3}总是喜欢跳来跳去{4}", answers: ["“", "”", "，", "，", "。"] },
            { text: "公园的草地上立着一块木牌{0}上面写着{1}爱护花草{2}四个大字{3}提醒我们要保护环境{4}", answers: ["，", "“", "”", "，", "。"] },
            { text: "动物园的解说员指着前方说{0}{1}大家快看{2}那里有斑马{3}长颈鹿{4}河马和犀牛{5}{6}", answers: ["：", "“", "，", "、", "、", "。", "”"] }
        ];

        let currentQuestionIndex = 0;
        let currentQuestionAnswers = []; // 当前题目每个槽位的答案状态
        let isReviewMode = false; // 是否处于回看模式

        const questionContainer = document.getElementById('question-container');
        const submitBtn = document.getElementById('submit-btn');
        const progressSpan = document.getElementById('progress');
        const messageDiv = document.getElementById('message');
        const poolItems = document.querySelectorAll('.punctuation-item');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function startGame() {
            // 初始化音频上下文 (必须在用户交互后)
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-game-ui').style.display = 'flex';
            document.getElementById('nav-buttons').style.display = 'flex'; // 显示导航按钮
            
            // 重置为非回看模式
            isReviewMode = false;
            document.getElementById('pool').style.display = 'flex';
            document.getElementById('instruction-text').style.display = 'block';
            document.getElementById('exit-review-btn').style.display = 'none';
            
            // 播放一个开始音效
            playTone(400, 'sine', 0.1);
            setTimeout(() => playTone(600, 'sine', 0.15), 100);
            
            initGame();
        }

        function initGame() {
            loadQuestion(0);
            setupDragAndDrop();
        }

        function loadQuestion(index) {
            if (endTimeout) clearTimeout(endTimeout); // 清除可能存在的结束延时
            
            currentQuestionIndex = index;
            progressSpan.textContent = `${index + 1} / ${questions.length}`;
            const q = questions[index];
            currentQuestionAnswers = new Array(q.answers.length).fill(null);
            
            // 解析文本，生成带空槽的HTML
            let htmlContent = q.text;
            q.answers.forEach((_, i) => {
                htmlContent = htmlContent.replace(`{${i}}`, `<div class="drop-zone" data-index="${i}"></div>`);
            });
            
            questionContainer.innerHTML = htmlContent;
            
            // 重置状态
            submitBtn.disabled = true;
            submitBtn.style.display = 'block'; // 恢复显示提交按钮
            submitBtn.style.background = '';
            submitBtn.textContent = "提交答案";
            messageDiv.textContent = "";
            messageDiv.className = "text-center mt-4 text-xl font-bold h-8";
            questionContainer.className = "question-box"; // 移除可能的动画类

            // 更新导航按钮状态
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === questions.length - 1;

            setupDropZones();

            // 如果是回看模式，直接填入正确答案并锁定
            if (isReviewMode) {
                const dropZones = document.querySelectorAll('.drop-zone');
                dropZones.forEach((zone, i) => {
                    zone.textContent = q.answers[i];
                    zone.classList.add('filled');
                    zone.style.borderColor = '#22c55e';
                    zone.style.backgroundColor = '#dcfce7';
                    zone.style.color = '#166534';
                });
                submitBtn.style.display = 'none';
                messageDiv.textContent = "👀 回看模式：标准答案";
                messageDiv.className = "text-center mt-4 text-xl font-bold h-8 text-blue-500";
            }
        }

        function goToPrevQuestion() {
            if (currentQuestionIndex > 0) {
                stopAllSounds(); // 按下按钮时立刻切断任何正在播放的特效音
                // 恢复提交按钮默认行为
                submitBtn.onclick = null;
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        function goToNextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                stopAllSounds(); // 按下按钮时立刻切断任何正在播放的特效音
                // 恢复提交按钮默认行为
                submitBtn.onclick = null;
                loadQuestion(currentQuestionIndex + 1);
            }
        }

        let draggedPunctuation = null;

        function setupDragAndDrop() {
            // PC端拖拽 (池子里的元素)
            poolItems.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedPunctuation = e.target.dataset.punct;
                    e.dataTransfer.setData('text/plain', draggedPunctuation);
                    e.dataTransfer.effectAllowed = 'copy';
                });

                // 触摸设备支持 (模拟拖拽)
                item.addEventListener('touchstart', handleTouchStart, {passive: false});
            });
            
            // 解决触摸移动和结束
            document.addEventListener('touchmove', handleTouchMove, {passive: false});
            document.addEventListener('touchend', handleTouchEnd);
        }

        let touchGhost = null;
        let currentTouchPunct = null;

        function handleTouchStart(e) {
            e.preventDefault(); // 阻止滚动
            const touch = e.touches[0];
            const target = e.target;
            
            if (target.classList.contains('punctuation-item')) {
                currentTouchPunct = target.dataset.punct;
                
                // 创建一个幽灵元素跟随手指
                touchGhost = target.cloneNode(true);
                touchGhost.classList.add('drag-ghost');
                document.body.appendChild(touchGhost);
                
                moveGhost(touch.pageX, touch.pageY);
            }
        }

        function handleTouchMove(e) {
            if (!touchGhost) return;
            e.preventDefault();
            const touch = e.touches[0];
            moveGhost(touch.pageX, touch.pageY);
            
            // 高亮下方可能的目标
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            document.querySelectorAll('.drop-zone').forEach(dz => dz.classList.remove('drag-over'));
            
            if (elementBelow && elementBelow.classList.contains('drop-zone')) {
                elementBelow.classList.add('drag-over');
            }
        }

        function handleTouchEnd(e) {
            if (!touchGhost) return;
            
            const touch = e.changedTouches[0];
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (elementBelow && elementBelow.classList.contains('drop-zone')) {
                fillZone(elementBelow, currentTouchPunct);
            }
            
            // 清理
            touchGhost.remove();
            touchGhost = null;
            currentTouchPunct = null;
            document.querySelectorAll('.drop-zone').forEach(dz => dz.classList.remove('drag-over'));
        }

        function moveGhost(x, y) {
            if(touchGhost) {
                touchGhost.style.left = (x - 25) + 'px'; // 偏移以手指居中
                touchGhost.style.top = (y - 25) + 'px';
            }
        }


        function setupDropZones() {
            const dropZones = document.querySelectorAll('.drop-zone');
            
            dropZones.forEach(zone => {
                // PC 端事件
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault(); // 允许放置
                    zone.classList.add('drag-over');
                    e.dataTransfer.dropEffect = 'copy';
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });

                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    const punct = e.dataTransfer.getData('text/plain');
                    if (punct) {
                        fillZone(zone, punct);
                    }
                });
                
                // 允许点击清空已填写的槽位
                zone.addEventListener('click', () => {
                   if (isReviewMode) return; // 回看模式下不可点击修改

                   if(zone.classList.contains('filled')) {
                       const index = parseInt(zone.dataset.index);
                       currentQuestionAnswers[index] = null;
                       zone.textContent = '';
                       zone.classList.remove('filled');
                       checkAllFilled();
                   }
                });
            });
        }

        function fillZone(zone, punct) {
            const index = parseInt(zone.dataset.index);
            currentQuestionAnswers[index] = punct;
            zone.textContent = punct;
            zone.classList.add('filled');
            soundEffects.drop();
            checkAllFilled();
        }

        function checkAllFilled() {
            const isAllFilled = currentQuestionAnswers.every(ans => ans !== null);
            submitBtn.disabled = !isAllFilled;
        }

        submitBtn.addEventListener('click', () => {
            const q = questions[currentQuestionIndex];
            let isCorrect = true;
            
            // 比较答案
            for (let i = 0; i < q.answers.length; i++) {
                if (currentQuestionAnswers[i] !== q.answers[i]) {
                    isCorrect = false;
                    break;
                }
            }

            const dropZones = document.querySelectorAll('.drop-zone');

            if (isCorrect) {
                // 答对处理
                soundEffects.correct();
                messageDiv.textContent = "答对啦！太棒了！🎉";
                messageDiv.className = "text-center mt-4 text-xl font-bold h-8 text-green-600";
                questionContainer.classList.add('correct-anim');
                
                dropZones.forEach(dz => {
                    dz.style.borderColor = '#22c55e';
                    dz.style.backgroundColor = '#dcfce7';
                    dz.style.color = '#166534';
                });

                if (currentQuestionIndex < questions.length - 1) {
                    submitBtn.textContent = "下一题";
                    submitBtn.style.background = "linear-gradient(to bottom, #3b82f6, #2563eb)";
                    submitBtn.style.boxShadow = "0 6px 0 #1d4ed8";
                    
                    // 改变按钮行为为进入下一题
                    submitBtn.onclick = handleNextAfterCorrect;
                } else {
                    // 第20题：隐藏按钮，延时后自动结束
                    submitBtn.style.display = 'none';
                    endTimeout = setTimeout(() => {
                        showCelebration();
                    }, 1500); // 留出 1.5 秒给小朋友看“答对啦”的状态
                }
                
            } else {
                // 答错处理
                soundEffects.wrong();
                messageDiv.textContent = "哎呀，不对哦，再试一次吧！💪";
                messageDiv.className = "text-center mt-4 text-xl font-bold h-8 text-red-500";
                
                // 触发震动动画
                questionContainer.classList.remove('wrong-anim');
                void questionContainer.offsetWidth; // 强制重排以重新触发动画
                questionContainer.classList.add('wrong-anim');
                
                // 标红错误的槽位
                dropZones.forEach((dz, i) => {
                    if (currentQuestionAnswers[i] !== q.answers[i]) {
                        dz.style.borderColor = '#ef4444';
                        dz.style.backgroundColor = '#fee2e2';
                        dz.style.color = '#b91c1c';
                    } else {
                         dz.style.borderColor = '#22c55e'; // 对的保持绿色
                    }
                });
            }
        });

        function handleNextAfterCorrect() {
            stopAllSounds(); // 点击中间的“下一题”时也切断余音
            // 恢复提交按钮默认行为
            submitBtn.onclick = null; 
            
            if (currentQuestionIndex < questions.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            } else {
                showCelebration();
            }
        }

        function showCelebration() {
            document.getElementById('celebration').style.display = 'flex';
            document.getElementById('nav-buttons').style.display = 'none'; // 隐藏导航按钮
            soundEffects.correct(); // 播放胜利音效
            // 可以加入一些彩带特效等，这里用简单的显示代替
        }

        function startReview() {
            isReviewMode = true;
            document.getElementById('celebration').style.display = 'none';
            document.getElementById('main-game-ui').style.display = 'flex';
            document.getElementById('nav-buttons').style.display = 'flex';
            
            // 隐藏拖拽池和提交按钮，显示退出回看按钮
            document.getElementById('pool').style.display = 'none';
            document.getElementById('instruction-text').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('exit-review-btn').style.display = 'inline-block';
            
            loadQuestion(0); // 从第一题开始回看
        }

        function exitReview() {
            isReviewMode = false;
            document.getElementById('main-game-ui').style.display = 'none';
            document.getElementById('celebration').style.display = 'flex';
        }

        // 移除 window.onload 自动启动游戏，改为由开始按钮触发
        // window.onload = initGame; 

    </script>
</body>
</html>
